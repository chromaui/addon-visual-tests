name: Publish preview

# Publishes an installable preview build of every PR commit and every push to main to pkg.pr.new.
# Nothing is published to the npm registry. See RELEASING.md.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish preview
        run: pnpm exec pkg-pr-new publish --pnpm --packageManager=npm,pnpm,yarn
